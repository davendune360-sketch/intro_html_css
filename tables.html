<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Tables</title>

    <style>
        body {
            background: #ffffff;
            font-family: FreeSans, sans-serif;
        }

        table {
            border: 2px solid #000000;
            border-collapse: collapse;
            width: 61%;
            margin: auto;
        }

        th{
            border: 1px solid #000000;
            padding-top: 10px;
            padding-bottom: 8px;
            text-align: left;
            background: gray;
            color: white;
            padding-left: 8px;
        }

        td {
            border: 1px solid #0000ff;
            padding: 10px;
        }

        .dob-column{
            color: #00ffff;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>

</body>
</html>
